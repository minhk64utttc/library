services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thu_vien
      POSTGRES_PASSWORD: thu_vien
      POSTGRES_DB: thu_vien
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thu_vien"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://thu_vien:thu_vien@postgres:5432/thu_vien?schema=public
      WEB_ORIGIN: http://localhost:8080
      SESSION_SECRET: thay-bang-secret-that-it-nhat-16-ky-tu
      SESSION_COOKIE_NAME: thu_vien_session
      SESSION_TTL_HOURS: 12
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: thu-vien@localhost
      DOCUMENT_STORAGE_PATH: /data/private-documents
      DEMO_CREDENTIALS_FILE: /demo-credentials/login.txt
    volumes:
      - ./data/documents:/data/private-documents
      - ./data/demo-credentials:/demo-credentials
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/prisma/seed-demo.cjs --apply && node apps/api/dist/main.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/auth/me').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

