function render(){nav();const f={search:search,detail:detail,loans:loans,submit:submit,desk:desk,inventory:inventory,queue:queue,reader:reader};$('#app').innerHTML=f[state.page]();if(state.page==='search')results()}
function heading(label,title,sub=''){return `<div class="eyebrow">${label}</div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}`}
function search(){return `<div class="wrap"><section class="hero"><div>${heading('Tra cứu & khám phá','Tìm tài liệu cho ý tưởng tiếp theo.')}<p>Sách, giáo trình và học liệu số trong cùng một không gian.</p></div><div class="hours"><span class="dot"></span>Thư viện đang mở cửa<strong>08:00 — 20:00</strong><span class="muted">Cơ sở A · Lịch phục vụ minh họa</span></div></section><form class="searchbar" onsubmit="event.preventDefault();state.q=$('#query').value;results()"><select aria-label="Phạm vi tìm kiếm" onchange="state.type=this.value;render()"><option value="">Tất cả tài liệu</option>${['Sách in','Tài liệu số','Luận văn'].map(t=>`<option ${state.type===t?'selected':''}>${t}</option>`).join('')}</select><label class="sr-only" for="query">Tìm tài liệu</label><input id="query" value="${esc(state.q)}" placeholder="Nhập nhan đề, tác giả hoặc mã tài liệu…" type="search"><button class="primary">Tìm kiếm</button></form><div class="searchhint">Gợi ý: <button class="link" onclick="quick('trí tuệ')">Trí tuệ nhân tạo</button><button class="link" onclick="quick('thiết kế')">Thiết kế hệ thống</button><button class="link" onclick="quick('')">Tất cả tài liệu</button></div><button class="mobilefilters small" onclick="$('.filters').classList.toggle('open')">Bộ lọc tài liệu</button><div class="catalog"><aside class="filters"><div class="filterhead"><h2>Thu hẹp kết quả</h2><button class="link small" onclick="state.type='';state.only=false;state.q='';render()">Đặt lại</button></div><div class="filterblock"><h3>Loại tài liệu</h3>${['','Sách in','Tài liệu số','Luận văn'].map(t=>`<label class="check"><input type="radio" name="type" ${state.type===t?'checked':''} onchange="state.type='${t}';results()">${t||'Tất cả'}</label>`).join('')}</div><div class="filterblock"><h3>Khả dụng</h3><label class="check"><input type="checkbox" ${state.only?'checked':''} onchange="state.only=this.checked;results()">Có thể mượn / đọc ngay</label></div><div class="filterblock"><h3>Địa điểm</h3><p class="muted" style="font-size:13px">Cơ sở A và kho học liệu số</p></div><div class="note">Mỗi bản sách đều có vị trí kệ. Xem chi tiết để tìm đúng cuốn bạn cần.</div></aside><section><div class="resultshead"><span id="count"></span><label>Sắp xếp <select aria-label="Sắp xếp" onchange="state.sort=this.value;results()"><option value="relevance">Mặc định</option><option value="new">Năm mới nhất</option><option value="title">Tên A–Z</option></select></label></div><div id="results" class="cards"></div></section></div></div>`}
function quick(q){state.q=q;$('#query').value=q;results()}
function results(){let list=books.filter(b=>(!state.type||b.type===state.type)&&(!state.only||b.copies>0||b.type!=='Sách in')&&norm(b.title+' '+b.author+' '+b.code).includes(norm(state.q)));if(state.sort==='new')list.sort((a,b)=>b.year-a.year);if(state.sort==='title')list.sort((a,b)=>a.title.localeCompare(b.title,'vi'));$('#count').innerHTML=`<strong>${list.length} tài liệu</strong> <span class="muted">${state.q?'cho “'+esc(state.q)+'”':'trong bộ sưu tập minh họa'}</span>`;$('#results').innerHTML=list.length?list.map(b=>`<article class="bookcard"><div class="bookstage"><span class="typeflag">${b.type}</span>${cover(b)}</div><div class="bookbody"><div class="subject">${b.subject}</div><button class="titlebutton" onclick="openBook(${b.id})">${b.title}</button><div class="author">${b.author} · ${b.year}</div><div class="availability ${b.type==='Sách in'&&!b.copies?'wait':''}">${b.type!=='Sách in'?'↗ Có toàn văn':b.copies?'● Còn '+b.copies+' bản để mượn':'◷ Đang được mượn · Có thể đặt trước'}</div><div class="shelf"><span>${b.shelf}</span><b>${b.code}</b></div></div></article>`).join(''):'<div class="empty full"><h3>Chưa tìm thấy tài liệu</h3><p>Thử từ khóa ngắn hơn hoặc bỏ bớt bộ lọc.</p><button onclick="state.q=\'\';state.type=\'\';state.only=false;render()">Xóa điều kiện tìm kiếm</button></div>'}
function openBook(id){state.selected=id;go('detail')}
function detail(){let b=book(state.selected),digital=b.type!=='Sách in',held=state.holds.some(h=>h.id===b.id);return `<div class="wrap"><button class="link back" onclick="go('search')">← Quay lại kết quả tra cứu</button><div class="detailgrid"><div>${cover(b)}</div><section><div class="eyebrow">${b.subject} / ${b.type}</div><h1>${b.title}</h1><p class="muted">${b.author} · ${b.year}</p><p>${b.desc}</p><dl><dt>Mã tài liệu</dt><dd>${b.code}</dd><dt>Ngôn ngữ</dt><dd>Tiếng Việt</dd><dt>Định dạng</dt><dd>${digital?'PDF · Học liệu minh họa':'Bản in'}</dd><dt>Bộ sưu tập</dt><dd>${digital?'Học liệu số':'Giáo trình & tham khảo'}</dd></dl></section><aside class="panel"><h3>${digital?'Truy cập tài liệu':'Mượn tài liệu này'}</h3>${badge(digital?'Có thể đọc toàn văn':b.copies?'Còn '+b.copies+' bản':'Đang được mượn',!digital&&!b.copies?'warn':'')}<p class="muted" style="font-size:13px;margin-top:15px">${digital?'Dành cho bạn đọc có tài khoản trường. Bản xem thử gồm một trang minh họa.':b.copies?'Đến vị trí kệ bên dưới và mang sách tới quầy mượn trả.':'Bạn sẽ được thông báo khi có bản sao dành cho mình.'}</p>${digital?`<button class="primary" onclick="go('reader')">Đọc trực tuyến</button><button onclick="downloadSample()">Tải bản minh họa (.txt)</button>`:b.copies?`<button class="primary" onclick="document.getElementById('copies').scrollIntoView({behavior:'smooth'})">Xem vị trí trên kệ</button>`:`<button class="primary" ${held?'disabled':''} onclick="hold(${b.id})">${held?'Đã có trong đặt trước':'Đặt trước ấn bản'}</button>`}<div class="downloadline">Chính sách mẫu: đặt trước khi hết bản sẵn sàng.</div></aside></div><section class="panel" id="copies" style="margin-top:35px"><h2>${digital?'Thông tin truy cập':'Bản sao và vị trí'}</h2>${digital?'<p class="muted">Nội dung này phục vụ kiểm thử giao diện. Tệp và nội dung học thuật chính thức chưa được kết nối.</p>':`<div class="tablewrap"><table><thead><tr><th>Mã cuốn</th><th>Vị trí</th><th>Trạng thái</th></tr></thead><tbody>${Array.from({length:b.copies||1},(_,i)=>`<tr><td>${b.code}-${String(i+1).padStart(3,'0')}</td><td>${b.shelf}</td><td>${badge(b.copies?'Sẵn sàng':'Đang mượn',b.copies?'':'warn')}</td></tr>`).join('')}</tbody></table></div>`}</section></div>`}
function hold(id){confirmBox('Đặt trước tài liệu',`Bạn đang đặt trước “${book(id).title}”. Điểm nhận: cơ sở A. Bạn có thể hủy khi chưa nhận sách.`,'Xác nhận đặt trước',()=>{state.holds.push({id});render();toast('Đã đặt trước. Xem tiến độ tại Thư viện của tôi.')})}
function confirmBox(title,body,label,action){const d=$('#dialog');d.innerHTML=`<h2>${esc(title)}</h2><p class="muted">${esc(body)}</p><div class="actions"><button id="cancelDialog">Quay lại</button><button class="primary" id="confirmDialog">${esc(label)}</button></div>`;$('#cancelDialog').onclick=()=>d.close();$('#confirmDialog').onclick=()=>{d.close();action()};d.showModal()}
function loans(){let content='';if(state.tab==='loans')content=state.loans.length?`<div class="tablewrap"><table><thead><tr><th>Tài liệu</th><th>Hạn trả</th><th>Gia hạn</th><th>Thao tác</th></tr></thead><tbody>${state.loans.map(l=>{let b=book(l.id);return `<tr><td><strong>${b.title}</strong><small>${b.code} · Cơ sở A</small></td><td>${l.due}<br>${badge('Đang mượn','blue')}</td><td>${l.renew}/1 lần</td><td><button class="small" ${l.renew?'disabled title="Đã hết lượt gia hạn"':''} onclick="renew(${l.id})">Gia hạn</button>${l.renew?'<small style="display:block;margin-top:4px">Đã hết lượt gia hạn</small>':''}</td></tr>`}).join('')}</tbody></table></div>`:empty('Bạn chưa có sách đang mượn');else if(state.tab==='holds')content=state.holds.length?`<div class="tablewrap"><table><thead><tr><th>Tài liệu</th><th>Trạng thái</th><th>Nơi nhận</th><th></th></tr></thead><tbody>${state.holds.map(h=>`<tr><td><strong>${book(h.id).title}</strong></td><td>${badge('Đang chờ có sách','warn')}</td><td>Cơ sở A</td><td><button class="small" onclick="cancelHold(${h.id})">Hủy đặt trước</button></td></tr>`).join('')}</tbody></table></div>`:empty('Bạn chưa có yêu cầu đặt trước');else content=state.history.length?`<div class="tablewrap"><table><thead><tr><th>Tài liệu</th><th>Kết quả</th></tr></thead><tbody>${state.history.map(id=>`<tr><td>${book(id).title}</td><td>${badge('Đã trả')}</td></tr>`).join('')}</tbody></table></div>`:empty('Chưa có giao dịch trả trong phiên xem này');return `<div class="wrap">${heading('Không gian bạn đọc','Thư viện của tôi','Theo dõi sách đang mượn và những tài liệu bạn đang chờ.')}<div class="tabs">${[['loans','Đang mượn · '+state.loans.length],['holds','Đặt trước · '+state.holds.length],['history','Lịch sử trả']].map(([v,t])=>`<button class="${state.tab===v?'active':''}" onclick="state.tab='${v}';render()">${t}</button>`).join('')}</div><section class="panel">${content}</section><div class="note">Chính sách minh họa: tối đa 5 cuốn; mỗi khoản mượn được gia hạn 1 lần, thêm 7 ngày từ hạn cũ. Gia hạn cần được kiểm tra lại khi kết nối hệ thống thật.</div></div>`}
function empty(s){return `<div class="empty"><h3>${s}</h3><button onclick="go('search')">Khám phá tài liệu</button></div>`}
function renew(id){let l=state.loans.find(l=>l.id===id);if(!l||l.renew)return;confirmBox('Gia hạn khoản mượn',`Gia hạn “${book(id).title}” thêm 7 ngày từ hạn trả hiện tại?`,'Xác nhận gia hạn',()=>{let [d,m,y]=l.due.split('/').map(Number);let dt=new Date(y,m-1,d+7);l.due=[dt.getDate(),dt.getMonth()+1,dt.getFullYear()].map((x,i)=>i<2?String(x).padStart(2,'0'):x).join('/');l.renew++;render();toast('Đã gia hạn. Hạn trả mới: '+l.due)})}
function cancelHold(id){confirmBox('Hủy đặt trước','Bạn sẽ rời hàng chờ của tài liệu này.','Hủy đặt trước',()=>{state.holds=state.holds.filter(h=>h.id!==id);render();toast('Đã hủy đặt trước.')})}
function staffShell(title,sub,body){return `<div class="stafflayout"><aside class="staffnav"><small>BÀN LÀM VIỆC</small>${[['desk','▣  Quầy mượn trả'],['inventory','▤  Danh mục tài liệu'],['queue','▧  Hồ sơ chờ duyệt']].map(([p,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}<div class="note">Điểm phục vụ A<br><strong>Phiên minh họa</strong></div></aside><div class="staffmain"><div class="row"><div>${heading('Nghiệp vụ thư viện',title,sub)}</div>${badge('Cơ sở A','blue')}</div>${body}</div></div>`}
function desk(){let out=state.deskTab==='out';return staffShell('Quầy mượn trả','Quét mã, kiểm tra và hoàn tất giao dịch tại một nơi.',`<div class="tabs"><button class="${out?'active':''}" onclick="state.deskTab='out';state.scanned=[];render()">Cho mượn</button><button class="${!out?'active':''}" onclick="state.deskTab='in';state.scanned=[];render()">Nhận trả</button></div><div class="deskgrid"><aside class="panel"><div class="eyebrow">Bạn đọc mẫu</div><div class="borrower"><div class="avatar">MA</div><div><strong>Nguyễn Minh Anh</strong><div class="muted" style="font-size:12px">SV20240018 · Công nghệ thông tin</div></div></div>${badge('Thẻ đang hoạt động')}<div class="deskstatus">✓ Đủ điều kiện sử dụng dịch vụ<br>Không có khoản phạt chưa thanh toán</div><div class="facts"><div class="muted">Đang mượn<strong>${state.loans.length} / 5 cuốn</strong></div><div class="muted">Hạn thẻ<strong>30/06/2027</strong></div></div><div class="meter"><i style="width:${state.loans.length*20}%"></i></div><p class="muted" style="font-size:11px">Bạn đọc được cố định để thử luồng mượn / trả.</p></aside><section class="panel"><h3>${out?'Thêm sách vào phiếu mượn':'Quét sách cần nhận trả'}</h3><form class="scan" onsubmit="event.preventDefault();scan()"><label class="sr-only" for="barcode">Mã tài liệu</label><input id="barcode" placeholder="${out?'Nhập AI-001 hoặc TD-006':'Nhập HT-004 hoặc CT-002'}" autocomplete="off"><button>Thêm</button></form><p class="muted" style="font-size:12px;margin-top:10px">Thử nhanh: ${out?'<button class="link small" onclick="scan(\'AI-001\')">AI-001</button> · <button class="link small" onclick="scan(\'TD-006\')">TD-006</button>':'<button class="link small" onclick="scan(\'HT-004\')">HT-004</button> · <button class="link small" onclick="scan(\'CT-002\')">CT-002</button>'}</p>${state.scanned.length?`<div class="tablewrap"><table><thead><tr><th>Tài liệu</th><th>Kiểm tra</th><th></th></tr></thead><tbody>${state.scanned.map(id=>`<tr><td><strong>${book(id).title}</strong><small>${book(id).code}</small></td><td>${badge(out?'Có thể cho mượn':'Có khoản mượn đang mở')}</td><td><button class="small" onclick="state.scanned=state.scanned.filter(x=>x!==${id});render()">Bỏ</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="margin-top:20px"><h3>Chưa có sách được quét</h3>Nhập mã hoặc chọn mã thử nhanh ở trên.</div>'}<div class="actions"><span class="muted" style="font-size:12px;margin-right:auto">${state.scanned.length} cuốn trong giao dịch</span><button class="primary" ${!state.scanned.length?'disabled':''} onclick="commitDesk()">${out?'Xác nhận cho mượn':'Xác nhận nhận trả'}</button></div></section></div>`)}
function scan(code){code=(code||$('#barcode').value).trim().toUpperCase();let b=books.find(b=>b.code===code);if(!b)return toast('Không tìm thấy mã. Hãy thử mã gợi ý phía dưới.');if(state.scanned.includes(b.id))return toast('Tài liệu này đã được quét.');if(state.deskTab==='out'){if(b.type!=='Sách in'||!b.copies)return toast('Tài liệu không có bản in sẵn sàng.');if(state.loans.some(l=>l.id===b.id))return toast('Bạn đọc đã mượn tài liệu này.');if(state.scanned.length+state.loans.length>=5)return toast('Đã đạt hạn mức 5 cuốn.')}else if(!state.loans.some(l=>l.id===b.id))return toast('Không có khoản mượn đang mở cho tài liệu này.');state.scanned.push(b.id);render();$('#barcode').focus()}
function commitDesk(){let out=state.deskTab==='out',n=state.scanned.length;if(!n)return;state.scanned.forEach(id=>{if(out){state.loans.push({id,due:'19/11/2026',renew:0});book(id).copies--}else{state.loans=state.loans.filter(l=>l.id!==id);state.history.push(id);book(id).copies++}});state.scanned=[];render();toast(`Đã ${out?'cho mượn':'nhận trả'} ${n} cuốn trong dữ liệu mẫu.`)}
function inventory(){return staffShell('Danh mục tài liệu','Xem bản ghi, khả dụng và vị trí lưu trữ.',`<section class="panel"><div class="tablewrap"><table><thead><tr><th>Mã</th><th>Nhan đề / Tác giả</th><th>Loại</th><th>Khả dụng</th><th>Thao tác</th></tr></thead><tbody>${books.map(b=>`<tr><td>${b.code}</td><td><strong>${b.title}</strong><small>${b.author}</small></td><td>${b.type}</td><td>${badge(b.type==='Sách in'?b.copies+' bản sẵn sàng':'Có toàn văn',b.type==='Sách in'&&!b.copies?'warn':'')}</td><td><button class="small" onclick="openBook(${b.id})">Xem phía bạn đọc</button></td></tr>`).join('')}</tbody></table></div></section><div class="note">Màn hình này minh họa danh sách. Biên tập metadata và quản lý bản sao sẽ được thiết kế ở bước tiếp theo.</div>`)}
function submit(){let f=state.form;let stages=['Thông tin công trình','Tệp & quyền công bố','Kiểm tra & gửi'];let fields=state.step===0?`<div class="formgrid"><label class="field full">Nhan đề công trình *<input name="title" required value="${esc(f.title)}" placeholder="Ví dụ: Xây dựng hệ thống quản lý thư viện đại học"></label><label class="field">Loại công trình<select name="type"><option ${f.type==='Luận văn thạc sĩ'?'selected':''}>Luận văn thạc sĩ</option><option ${f.type==='Khóa luận tốt nghiệp'?'selected':''}>Khóa luận tốt nghiệp</option></select></label><label class="field">Năm hoàn thành<input name="year" type="number" min="2000" max="2030" value="${esc(f.year||2026)}" required></label><label class="field">Tác giả<input value="Nguyễn Minh Anh" readonly></label><label class="field">Người hướng dẫn *<input name="advisor" required value="${esc(f.advisor)}" placeholder="Họ và tên người hướng dẫn"></label><label class="field full">Tóm tắt *<textarea name="abstract" required placeholder="Mục tiêu, phương pháp và kết quả chính…">${esc(f.abstract)}</textarea></label></div>`:state.step===1?`<div class="dashed"><label class="field">Tệp toàn văn PDF *<input type="file" accept=".pdf,application/pdf" id="file" onchange="pickFile(this)"></label><p id="filename" class="muted" style="font-size:12px;margin:12px 0 0">${state.files.length?esc(state.files[0].name):'Tối đa 20 MB. Tệp chỉ được giữ trong phiên xem, chưa tải lên máy chủ.'}</p></div><label class="field" style="margin-top:24px">Phạm vi đề xuất<select name="access"><option ${f.access==='Chỉ thành viên trường'?'selected':''}>Chỉ thành viên trường</option><option ${f.access==='Công khai'?'selected':''}>Công khai</option></select></label><label class="check" style="margin-top:20px"><input type="checkbox" name="consent" required ${f.consent?'checked':''}>Tôi có quyền nộp tài liệu này và đồng ý gửi để thư viện xem xét.</label>`:`<div class="panel" style="background:#f8fafc"><h3>${esc(f.title)}</h3><p class="muted">${esc(f.type)} · ${esc(f.year)}</p><p><strong>Người hướng dẫn:</strong> ${esc(f.advisor)}</p><p>${esc(f.abstract)}</p><p><strong>Tệp:</strong> ${esc(state.files[0]?.name)}</p><p><strong>Phạm vi đề xuất:</strong> ${esc(f.access)}</p></div><div class="note">Gửi hồ sơ chưa đồng nghĩa với công bố tài liệu. Cán bộ sẽ kiểm tra và phản hồi.</div>`;return `<div class="wrap">${heading('Kho học liệu số','Nộp công trình của bạn','Gửi tài liệu để thư viện tiếp nhận, lưu trữ và xem xét công bố.')}<div class="formlayout"><section class="panel"><div class="steps">${stages.map((s,i)=>`<span class="${i===state.step?'active':''}">${i+1}. ${s}</span>`).join('')}</div><form id="submitform" onsubmit="event.preventDefault();nextStep()">${fields}<div class="actions"><span class="draftstatus" id="draftstatus"></span>${state.step?'<button type="button" onclick="saveForm();state.step--;render()">Quay lại</button>':''}<button type="button" onclick="saveForm();$(\'#draftstatus\').textContent=\'Đã lưu nháp trong phiên xem\';">Lưu nháp</button><button class="primary">${state.step===2?'Gửi hồ sơ':'Tiếp tục →'}</button></div></form></section><aside><section class="panel"><h3>Trước khi gửi</h3><p class="muted" style="font-size:13px">Chuẩn bị bản hoàn chỉnh và thông tin người hướng dẫn. Kiểm tra nội dung, định dạng và quyền công bố.</p><div class="note">Bạn luôn có thể quay lại để chỉnh sửa trước khi gửi.</div></section>${state.submissions.length?`<section class="panel" style="margin-top:20px"><h3>Hồ sơ của bạn</h3>${state.submissions.map(s=>`<p><strong>${esc(s.title)}</strong><br>${badge(s.status,s.status==='Đã tiếp nhận'?'':'blue')}</p>`).join('')}</section>`:''}</aside></div></div>`}
function saveForm(){let form=$('#submitform');if(!form)return;new FormData(form).forEach((v,k)=>state.form[k]=v);if(state.step===1)state.form.consent=form.elements.consent.checked}
function pickFile(input){let f=input.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.pdf')||f.size>20*1024*1024){input.value='';toast('Chọn tệp PDF có dung lượng tối đa 20 MB.');return}state.files=[f];$('#filename').textContent=f.name+' · '+Math.max(1,Math.round(f.size/1024))+' KB'}
function nextStep(){saveForm();if(state.step===1&&!state.files.length)return toast('Vui lòng chọn tệp toàn văn PDF.');if(state.step<2){state.step++;render();return}state.submissions.push({...state.form,id:state.submissions.length+1,status:'Chờ kiểm tra',filename:state.files[0].name});state.form={};state.files=[];state.step=0;render();toast('Đã gửi hồ sơ mẫu. Có thể xem tại giao diện cán bộ → Hồ sơ chờ duyệt.')}
function queue(){return staffShell('Hồ sơ chờ duyệt','Tiếp nhận công trình do bạn đọc gửi trong phiên xem.',`<section class="panel">${state.submissions.length?`<div class="tablewrap"><table><thead><tr><th>Công trình</th><th>Tệp</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${state.submissions.map(s=>`<tr><td><strong>${esc(s.title)}</strong><small>Nguyễn Minh Anh · ${esc(s.type)}</small></td><td>${esc(s.filename)}</td><td>${badge(s.status,s.status==='Đã tiếp nhận'?'':'blue')}</td><td><button class="small" ${s.status==='Đã tiếp nhận'?'disabled':''} onclick="acceptSubmission(${s.id})">Xem hồ sơ</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>Chưa có hồ sơ chờ kiểm tra</h3><p>Thử gửi một hồ sơ ở giao diện bạn đọc để xem luồng tiếp nhận.</p><button onclick="go(\'submit\')">Thử nộp công trình</button></div>'}</section>`)}
function acceptSubmission(id){let s=state.submissions.find(x=>x.id===id);confirmBox('Tiếp nhận hồ sơ mẫu',`${s.title}. Người hướng dẫn: ${s.advisor}. Phạm vi đề xuất: ${s.access}. Đây là thao tác tiếp nhận minh họa, chưa công bố tài liệu.`,'Xác nhận tiếp nhận',()=>{s.status='Đã tiếp nhận';render();toast('Đã tiếp nhận hồ sơ mẫu. Tài liệu chưa được công bố.')})}
function reader(){let b=book(state.selected);return `<div class="wrap"><div class="readingtop"><button class="link" onclick="go('detail')">← Thông tin tài liệu</button>${badge('Bản đọc minh họa','blue')}</div><article class="reader"><div class="eyebrow">Học liệu số / Trang xem thử</div><h1>${b.title}</h1><p class="muted">${b.author}</p><hr style="border:0;border-top:1px solid var(--line);margin:28px 0"><h2>Giới thiệu tài liệu</h2><p>${b.desc}</p><p>Đây là nội dung minh họa cho thiết kế màn hình đọc tài liệu. Không phải bản toàn văn của tài liệu được liệt kê. Khi triển khai, vùng này sẽ hiển thị trình đọc PDF sau khi kiểm tra quyền truy cập.</p><p class="muted">Trang 1 / 1 · Nội dung mô phỏng</p></article></div>`}
function downloadSample(){let b=book(state.selected);let url=URL.createObjectURL(new Blob([b.title+'\\n\\nBẢN MINH HỌA GIAO DIỆN — KHÔNG PHẢI TOÀN VĂN\\n\\n'+b.desc],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='tai-lieu-minh-hoa.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã tải tệp văn bản minh họa.')}
render();
</script>
</body></html>
